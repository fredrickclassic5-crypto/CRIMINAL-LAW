<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Reader</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top-bar">

    <button onclick="history.back()">⬅ Back</button>

    <div class="logo">
        Ghana Criminal Laws
    </div>

</header>

<section class="hero">

    <h2 id="sectionTitle"></h2>

    <p id="lawTitle"></p>

</section>

<div class="law-content">

    <p id="lawText"></p>

</div>

<div class="reader-buttons">

    <button id="prevBtn">
        ⬅ Previous
    </button>

    <button id="bookmarkBtn">
        ⭐ Bookmark
    </button>

    <button id="pdfBtn">
        📄 Open Official PDF
    </button>

    <button id="readBtn">
        🔊 Read Aloud
    </button>

    <button id="stopBtn">
        ⏹ Stop
    </button>

    <button id="nextBtn">
        Next ➡
    </button>

</div>

<script src="js/reader.js"></script>

</body>
</html>
