<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#071f3d"
    >

    <title>
        Legal Provision | Ghana Criminal Laws
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="modern-dashboard">


<!-- ========================================
     HEADER
======================================== -->

<header class="modern-header">

    <a
        href="javascript:history.back()"
        class="back-button"
        aria-label="Go back"
    >
        ←
    </a>


    <div class="modern-brand">

        <div class="brand-icon">
            ⚖️
        </div>


        <div class="brand-text">

            <strong>
                Ghana Criminal Laws
            </strong>

            <small>
                Legal Provision
            </small>

        </div>

    </div>


    <div class="header-badge">
        ⚖
    </div>

</header>



<!-- ========================================
     MAIN
======================================== -->

<main class="modern-main">


    <!-- ====================================
         READER
    ===================================== -->

    <section
        id="lawReader"
        class="law-reader"
    >

        <div class="loading-card">

            <div class="loading-icon">
                ⚖️
            </div>


            <h3>
                Loading Legal Provision
            </h3>


            <p>
                Please wait while the legal
                provision is being loaded.
            </p>

        </div>

    </section>


</main>



<!-- ========================================
     JAVASCRIPT
======================================== -->

<script src="js/reader.js"></script>


</body>

</html>
