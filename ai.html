<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Legal Assistant</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top-bar">
    <h2>🤖 Ghana AI Legal Assistant</h2>
</header>

<section class="hero">

    <h1>Ask the Law</h1>

    <p>Ask any question about Ghana Criminal Laws</p>

</section>

<div class="ai-container">

    <textarea
        id="question"
        placeholder="Example: What is stealing?">
    </textarea>

    <button id="askBtn">
        Ask AI
    </button>

    <div id="answer">

        Your answer will appear here.

    </div>

</div>

<script src="js/ai.js"></script>

</body>
</html>
